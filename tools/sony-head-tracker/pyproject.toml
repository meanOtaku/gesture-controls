[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sony-head-tracking"
version = "0.1.0"
description = "UDP receiver for Sony headphone head-orientation data"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sony-head-tracking = "sony_head_tracking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
