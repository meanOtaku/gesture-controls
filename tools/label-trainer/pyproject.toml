[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-trainer"
version = "0.1.0"
description = "Offline training of one per-label gesture model, written as an ONNX bundle the desktop app imports."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
torch = ["torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]

[project.scripts]
label-classifier-train = "label_trainer.label_train:cli"

[tool.setuptools.packages.find]
where = ["src"]
