[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "label-trainer"
version = "0.1.0"
description = "Offline training of one label's PPG pinch-start model (multi-scale z-score derivatives, ExtraTrees), written as a bundle the desktop app imports."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
label-classifier-train = "label_trainer.label_train:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["strict_gate: keep the trainer's real whole-recording limits (see tests/conftest.py)"]
