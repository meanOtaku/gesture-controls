[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinch-classifier"
version = "0.1.0"
description = "Offline training package for the pinch_start / pinch_release gesture classifier (Milestone 10, slice 1). scikit-learn baseline only; TFLite/LiteRT export is a later conversion step."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pinch-classifier-train = "pinch_classifier.train:main"

[tool.setuptools.packages.find]
where = ["src"]
