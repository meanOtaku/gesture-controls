[package]
name = "watch-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
btleplug.workspace = true
futures-util.workspace = true
mdns-sd.workspace = true
serde.workspace = true
serde_json.workspace = true
spatial-protocol = { path = "../protocol" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# btleplug's Linux backend links libdbus. Vendoring it keeps Linux desktop
# builds from additionally requiring system pkg-config + libdbus-1-dev headers;
# macOS (CoreBluetooth) and Windows (WinRT) need nothing extra.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }
