[package]
name = "pinch-inference"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
interaction-engine = { path = "../interaction-engine" }
spatial-protocol = { path = "../protocol" }
thiserror.workspace = true
litert = { version = "0.2", optional = true }

[features]
# Real LiteRT/TFLite model execution. Off by default: `litert-sys` (the
# native binding this pulls in) fetches a prebuilt LiteRT shared library at
# build time, which is slow and network-dependent -- unsuitable for the
# default `cargo test`/`cargo clippy` path CI and every contributor run on
# every change. Desktop release packaging must instead use the explicit
# `npm run package:litert` entrypoint documented in
# `docs/release/litert-runtime-packaging.md`; it requires a reviewed native
# runtime and forbids that network fetch. The default desktop build remains
# fail-closed with no model backend compiled in.
litert = ["dep:litert"]
