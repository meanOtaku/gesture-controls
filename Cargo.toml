[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/protocol",
  "crates/head-tracking",
  "crates/interaction-engine",
  "crates/volume-control",
  "crates/watch-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/meanOtaku/gesture-controls"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
futures-util = "0.3"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
