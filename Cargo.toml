[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/protocol",
  "crates/system-control",
  "crates/automation",
  "crates/head-tracking",
  "crates/interaction-engine",
  "crates/native-head-tracking",
  "crates/pinch-inference",
  "crates/volume-control",
  "crates/watch-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/meanOtaku/gesture-controls"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
btleplug = "0.13"
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1"] }
futures-util = "0.3"
mdns-sd = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
# Debug symbols are not needed at run time, and stripping them takes the desktop binary from
# 17.5 MB to 12.0 MB (-31%) with no extra compile time and no behavior change (panic messages
# are unaffected; only function names in backtraces are lost). Thin LTO plus one codegen unit
# would save ~2 MB more but adds ~1.5 minutes per OS to every CI package job, with no measured
# runtime gain; see docs/performance.md.
strip = "symbols"
