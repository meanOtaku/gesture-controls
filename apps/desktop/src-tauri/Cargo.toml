[package]
name = "spatial-gesture-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "spatial_gesture_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
automation = { path = "../../../crates/automation" }
head-tracking = { path = "../../../crates/head-tracking" }
label-inference = { path = "../../../crates/label-inference" }
model-lab-core = { path = "../../../crates/model-lab-core" }
interaction-engine = { path = "../../../crates/interaction-engine" }
native-head-tracking = { path = "../../../crates/native-head-tracking" }
system-control = { path = "../../../crates/system-control" }
volume-control = { path = "../../../crates/volume-control" }
spatial-protocol = { path = "../../../crates/protocol" }
watch-bridge = { path = "../../../crates/watch-bridge" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["macos-private-api"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sha2 = { version = "0.11.0", default-features = false }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
