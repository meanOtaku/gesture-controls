name: SpatialHeadTracking

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  SpatialHeadTracking:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Core
      - path: Hardware
    dependencies:
      - sdk: IOKit.framework
      - sdk: ApplicationServices.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.spatialgestures.headtracking
        PRODUCT_NAME: Spatial Head Tracking
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Spatial Head Tracking
        CFBundleName: SpatialHeadTracking
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: Unofficial and not affiliated with or endorsed by Sony.
