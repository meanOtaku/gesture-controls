   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(30.4955 93.622245)">1. Canonical recording groups</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(27.024406 105.624979)">Sensor hashes + label versions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(27.012688 117.627714)">Keep aliases in the same group</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(261.914062 93.622245)">2. Development only</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(251.973438 105.624979)">Grouped inner validation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(230.278125 117.627714)">Choose architecture + thresholds</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(444.938094 93.622245)">3. Freeze before new collection</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(434.041219 105.624979)">Models, code, matching, exclusions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(445.49825 117.627714)">Declare hypotheses + budgets</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(445.595906 218.694885)">4. New participants / new days</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(442.041219 230.697619)">Strap refits + realistic negatives</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(445.166219 242.700354)">No fitting or threshold changes</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(231.403906 218.694885)">5. Continuous replay + live tasks</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(247.823438 230.697619)">Catch / miss / repeat / late</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(233.450781 242.700354)">Raw decision and action latency</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(48.904094 218.694885)">6. Report all outcomes</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(26.008781 230.697619)">Per-label and per-person results</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(20.406438 242.700354)">Exposure + uncertainty + failures</text>
   </g>
   <g id="text_7">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle" x="314.1" y="17.837812" transform="rotate(-0 314.1 17.837812)">Proposed confirmatory protocol — not yet performed</text>
   </g>
  </g>
 </g>
