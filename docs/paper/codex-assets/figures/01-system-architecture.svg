   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(78.613344 219.261562)">Commercial watch</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(75.636 230.459375)">Green / red / IR PPG</text>
