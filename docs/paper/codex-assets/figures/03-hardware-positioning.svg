   <g id="text_1">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(117.802609 171.091731)">μDPad: purpose-built prototype</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(204.138 183.409325)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(99.868313 195.726919)">Waveshare ESP32-S3-LCD + QMI8658</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(133.388234 208.044513)">Additional XIAO ESP32-S3</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(133.553234 220.362106)">Eight-channel spatial PPG</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(204.138 232.6797)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(113.202375 244.997294)">Pinch close/open + wrist rotation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(497.431687 171.091731)">This project: commercial devices</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(587.862 183.409325)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(489.312312 195.726919)">Unmodified Samsung Galaxy Watch</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(494.466844 208.044513)">Built-in green / red / IR PPG + IMU</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(487.395047 220.362106)">Consumer headphone head tracking</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(587.862 232.6797)"/>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(482.575672 244.997294)">Laptop inference and bounded control</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(195.060156 335.064588)">Spatial optical channels ≠ wavelength channels. Task, cohort and sensors differ.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(229.790625 346.2624)">Commercial-watch PPG gesture sensing also predates this project.</text>
   </g>
  </g>
  <g id="text_4">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle" x="396" y="18.557813" transform="rotate(-0 396 18.557813)">Closest-prior-work hardware distinction — not a performance ranking</text>
