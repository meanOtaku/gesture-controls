   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(89.070469 129.837566)">1. Declare + freeze</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(73.508203 139.915597)">Labels, groups, thresholds</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(67.725 149.993629)">Budgets and match windows</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(348.903984 129.837566)">2. Matched ablations</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(356.194687 139.915597)">IMU / PPG / fusion</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(338.558906 149.993629)">Scaling and gate variants</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(603.361406 129.837566)">3. Physical perturbations</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(610.12125 139.915597)">Movement then pinch</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(606.424219 149.993629)">Haptics on/off with logs</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(604.567969 301.053566)">4. Prospective collection</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(600.590391 311.131597)">New days + refits + users</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(602.294766 321.209629)">Calibration kept separate</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(342.821953 301.053566)">5. Complete interaction</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(321.669844 311.131597)">Select → grab → adjust → release</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(334.020938 321.209629)">Fault and cancellation trials</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(76.694766 301.053566)">6. Report every outcome</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(81.248203 311.131597)">Miss / late / repeat / FA</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(65.106562 321.209629)">Exposure, latency, availability</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="396" y="387.40752" transform="rotate(-0 396 387.40752)">Study design schematic only. No participant outcomes, power estimates or superiority results are invented.</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle" x="396" y="18.989813" transform="rotate(-0 396 18.989813)">Proposed next experiments — no outcome values exist yet</text>
  </g>
